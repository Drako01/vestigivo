name: Vestigivo RCA PR Verification
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'test/**', 'media/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vestigivo-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: TypeScript, unit tests and VSIX candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Reproducible dependency install (npm ci)
        run: npm ci --ignore-scripts --no-fund
      - name: Compile once and test
        run: npm run check
      - name: Decide whether the native Extension Host needs another smoke
        id: host-scope
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$HEAD_SHA" ]]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch origin "$HEAD_SHA" --depth=2
          if git diff --name-only "$HEAD_SHA^" "$HEAD_SHA" | grep -E '^(src/extension\.ts|src/ui/|media/control-center\.html|test/host/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Real VS Code Extension Host smoke (Linux, UI-relevant changes only)
        if: steps.host-scope.outputs.run == 'true'
        run: xvfb-run -a npm run test:host
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify PNG dimensions, transparency and Activity Bar SVG
        run: npm run brand:verify
      - name: Package a private VSIX candidate
        run: npx vsce package --no-dependencies
      - name: Record checksum and inventory
        shell: bash
        run: |
          sha256sum *.vsix > SHA256SUMS
          unzip -l *.vsix | head -n 60
      - name: Upload artifact (no publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vestigivo-rca-vsix-candidate
          path: |
            *.vsix
            SHA256SUMS
          retention-days: 7
