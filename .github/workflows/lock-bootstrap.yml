name: Temporary lockfile bootstrap (private PR #3)
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  bootstrap-lock:
    if: github.repository == 'Drako01/vestigivo' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/enterprise-aaaaa-incident-intelligence-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact private feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate standard npm v10 lock without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile ONLY to PR feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Lockfile already tracked; no bootstrap commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): commit reproducible npm lockfile for PR verification'
          git push origin HEAD:feat/enterprise-aaaaa-incident-intelligence-20261108
