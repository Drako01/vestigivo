<html lang="en">
<head>

<title>Vestigivo RCA — Control Center</title>
<style nonce="__NONCE__">
:root{--surface:var(--vscode-editor-background);--ink:var(--vscode-editor-foreground);--muted:var(--vscode-descriptionForeground);--border:var(--vscode-panel-border,var(--vscode-widget-border,#3e4857));--accent:var(--vscode-focusBorder,#4dd6c8);--card:var(--vscode-sideBar-background,var(--vscode-editor-background));--ui:var(--vscode-font-family,system-ui)}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700;color:var(--muted)}
.brand{display:flex;gap:14px;align-items:center}
.mark{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:25px;color:#48d7ce}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.045em}

.description{max-width:800px;color:var(--muted);margin:12px 0 20px}

.status-detail{overflow-wrap:anywhere;color:var(--muted)}

.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:17px 18px}

h2{font-size:22px;line-height:1.3;letter-spacing:-.02em;margin:0 0 8px}
h3{font-size:15px;margin:0 0 9px}
p{margin:6px 0 12px}
.content-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.card{padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:12px 0}
.card p:last-child{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono,pre,code{font-family:var(--vscode-editor-font-family,ui-monospace,monospace);overflow-wrap:anywhere}
pre{max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:16px;font-size:12px}
.item{border-bottom:1px solid var(--border);padding:14px 0}
.item:last-child{border:0}
.item-head{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.tag{font-size:11px;text-transform:uppercase;font-weight:750;letter-spacing:.04em;padding:3px 7px;border-radius:5px;border:1px solid var(--border)}
.tag-warn{border-color:#e6a75b}
.tag-error{border-color:#f67880}
.table{width:100%;border-collapse:collapse;text-align:left}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.table th{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 200px}
.empty{padding:42px 24px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:14px}
.empty strong{font-size:16px;display:block;margin-bottom:6px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.table th,.table td{padding:9px 5px}#shell{padding-top:18px}}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat strong{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(forced-colors:active){.tag,.card,.stat,button{border:1px solid CanvasText}nav button[aria-selected=true]{border-bottom:3px solid Highlight}}
</style>
</head>
<body>
<div id="shell">
<header>
<div class="brand"><div class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="46" height="46" focusable="false" aria-hidden="true"><rect x="16" y="10" width="134" height="134" rx="15" fill="#111A26"/><path d="M44 43 L72 61 L97 46 L123 64 L104 81" fill="none" stroke="#3984A5" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="43" r="5" fill="#3984A5"/><circle cx="72" cy="61" r="5" fill="#3984A5"/><circle cx="97" cy="46" r="5" fill="#3984A5"/><circle cx="123" cy="64" r="5" fill="#3984A5"/><path d="M52 102 L75 83" fill="none" stroke="#8566DF" stroke-width="3.7" stroke-linecap="round"/><circle cx="52" cy="102" r="5" fill="#8566DF"/><circle cx="75" cy="83" r="5" fill="#8566DF"/><path d="M106 98 L114 112" fill="none" stroke="#3984A5" stroke-width="3.7" stroke-linecap="round"/><circle cx="114" cy="112" r="5" fill="#E5A04F"/><circle cx="97" cy="86" r="14.2" fill="#111A26" stroke="#48D7CE" stroke-width="4"/><circle cx="97" cy="86" r="5.1" fill="#48D7CE"/></svg></div><div><div class="eyebrow">Incident Intelligence</div><h1>VESTIGIVO RCA</h1><p>Incident Intelligence / Root Cause Analysis</p></div></div>
<div class="actions"><button data-action="new" type="button" data-label="new">New case</button><button data-action="open" type="button" data-label="open">Open saved</button><button data-action="import" type="button" class="primary" data-label="import">Import evidence</button></div>
</header>
<p class="description" id="subtitle">Every incident leaves evidence. Observations and correlations are not causal proof.</p>
<div id="status" aria-live="polite" role="status"></div>
<section class="stats" id="stats" aria-label="Case metrics"></section>
<nav id="navigation" aria-label="Investigation sections" role="tablist"></nav>
<main id="content" role="tabpanel" tabindex="-1" aria-live="off"></main>
<footer id="footnote">Local-first · No implicit network calls · Redaction is best-effort · No automatic root-cause confirmation.</footer>
</div>

let model = null, tab='overview', filter={text:'',severity:'ALL',service:'ALL'}, noteText='',claimText='';
const t = key => (labels[(model && model.language==='es')?'es':'en'][key] || key);
const send = (type, more={}) => vscode.postMessage(Object.assign({type},more));
function el(tag, className, text) { const e=document.createElement(tag); if(className)e.className=className;if(text!==undefined)e.textContent=String(text);return e; }
function append(parent,...children){for(const c of children)if(c)parent.append(c);return parent}
function button(text,action,primary=false,more={}) {const b=el('button',primary?'primary':'',text);b.type='button';b.dataset.action=action;for(const [key,value] of Object.entries(more))b.dataset[key]=value;b.disabled=!!(model&&model.busy);return b;}

function ts(o){return o.timestamp||t('missingTime')}

for(const [field,key,values] of [['severity','severity',['ALL','TRACE','DEBUG','INFO','WARN','ERROR','FATAL','UNKNOWN']],['service','service',['ALL',...new Set((model.case.observations||[]).map(o=>o.service).filter(Boolean))]]]){const label=append(el('label','field'),el('span','small',t(key)));const select=el('select');for(const value of values){const option=el('option','',value==='ALL'?t('all'):value);option.value=value;select.append(option)}select.value=filter[field];select.addEventListener('change',()=>{filter[field]=select.value;renderContent()});append(label,select);bar.append(label)}
container.append(bar)}
function observationRow(o){const item=el('article','item');const top=el('div','item-head');const left=el('div');append(left,el('span','tag '+(o.severity==='ERROR'||o.severity==='FATAL'?'tag-error':''),o.severity),el('span','small mono','  '+ts(o)));append(top,left,button(t('openSource'),'openSource',false,{observationId:o.id}));append(item,top,el('p','',o.message),paragraph((o.service||'Unknown service')+' · source '+o.provenance.sourceId+' #'+o.provenance.ordinal,'small muted'));return item;}
function overview(root){append(root,head(t('overview'),'Evidence-backed incident workspace. No automatic RCA conclusions.'));if(!model.case.observations.length){root.append(empty(t('empty'),t('emptyInfo')));root.append(button(t('import'),'import',true));return}
const grid=el('div','grid');
append(grid,card('Current case',model.case.title+' · '+model.case.id),card('Observed signals',model.case.observations.length+' imported records across '+model.case.sources.length+' selected source(s).'));
root.append(grid);const recent=el('section','card');append(recent,el('h3','','Latest observations'));for(const o of records().slice(-5))recent.append(observationRow(o));root.append(recent);
}
function timeline(root){append(root,head(t('timeline'),'Sorted by available source timestamps; missing/ambiguous clocks are not fabricated.'));filters(root);const list=records();const area=el('div','card');if(!list.length)area.append(empty(t('noResult'),''));for(const o of list.slice(0,400))area.append(observationRow(o));if(list.length>400)area.append(paragraph('Showing 400 of '+list.length+' filtered observations.','small'));root.append(area)}
function evidence(root){append(root,head(t('evidence'),'Source fingerprints and original record provenance. Open source works only if the original file remains available in this session.'));if(!model.case.sources.length){root.append(empty(t('empty'),t('emptyInfo')));return}for(const s of model.case.sources){const area=el('div','card');append(area,el('h3','',s.name),paragraph('SHA-256 '+s.sha256,'mono small'),paragraph(s.format+' · '+s.byteLength+' bytes · '+s.importedAt,'small'));root.append(area)}for(const o of records().slice(0,100)){const a=observationRow(o);a.append(el('pre','',JSON.stringify(o.attributes,null,2)));root.append(a)}}
function traces(root){
  append(root,head(t('traces'),'Exact trace/span/parent relationships. Orphans, cycles and ambiguous duplicated parents are labeled; no invented edges.'));
  if(!model.traceNodes||!model.traceNodes.length){root.append(empty('No trace spans','Import OTLP spans with traceId/spanId to build this evidence tree.'));return}
  if(model.traceCount>400)root.append(paragraph('Partial preview: 400 observations considered; remaining spans are not represented.','small muted'));
  const content=el('div','card');let current=null;
  for(const node of model.traceNodes){
    const o=node.observation;
    if(current!==o.traceId){current=o.traceId;content.append(el('h3','mono','Trace '+current))}
    const row=el('article','item');
    const warning=node.cycleDetected?'INVALID CYCLE':node.ambiguousParent?'AMBIGUOUS PARENT':node.missingParent?'MISSING PARENT':'OBSERVED';
    append(row,el('span','tag '+(node.cycleDetected?'tag-error':node.missingParent||node.ambiguousParent?'tag-warn':''),warning),
      paragraph((o.spanId||'unknown span')+' ← '+(node.parentId||'root span'),'mono small'),
      paragraph(o.message+' · '+(o.service||'unknown service')));

  root.append(content);

function correlations(root){append(root,head(t('correlations'),t('noCausality')));if(!model.case.correlations.length){root.append(empty('No exact identifier groups','Events must share an exact trace or request ID; timestamp proximity is insufficient.'));return}
for(const c of model.case.correlations){const a=el('section','card');append(a,el('span','tag',c.state),el('h3','',c.method+': '+c.key),paragraph(c.explanation),paragraph(c.observationIds.length+' observed records · '+c.observationIds.join(', '),'mono small'));root.append(a)}}
function git(root){append(root,head(t('git'),t('noGit'),[button(t('readGit'),'git',true)]));if(!model.git){root.append(empty('No Git context loaded','You must approve a read-only lookup in a trusted workspace.'));return}root.append(card('Repository',model.git.repository));for(const entry of model.git.entries){root.append(card(entry.subject,entry.sha+' · '+entry.date))}root.append(paragraph(model.git.note))}
function report(root){append(root,head(t('report'),'Preview before exporting. JSON and Markdown exports are redacted and versioned.',[button(t('exportMarkdown'),'exportMarkdown',true),button(t('exportJson'),'exportJson')]));root.append(paragraph(model.previewOmitted>0?'Preview only: '+model.previewOmitted+' further observations omitted from this display. Full export is performed separately; oversized Markdown exports are rejected, never silently truncated.':'Preview of the current redacted report.'));root.append(el('pre','',model.reportPreview||'No report available.'))}
function cases(root){append(root,head(t('cases'),t('history'),[button(t('save'),'save',true),button(t('open'),'open'),button(t('duplicate'),'duplicate'),button(t('archive'),'archive'),button(t('delete'),'delete')]));root.append(card('Incident case',model.case.title+' · '+model.case.id+(model.case.archived?' · Archived':'')));
const grid=el('div','grid');const n=el('div','card');append(n,el('h3','',t('note')));const area=el('textarea');area.value=noteText;area.maxLength=2000;area.addEventListener('input',()=>noteText=area.value);append(n,area,button(t('addNote'),'note'));grid.append(n);
const h=el('div','card');append(h,el('h3','',t('claim')));const claim=el('textarea');claim.value=claimText;claim.maxLength=1000;claim.addEventListener('input',()=>claimText=claim.value);append(h,claim,button(t('addHypothesis'),'hypothesis'));grid.append(h);root.append(grid);

for(const note of model.case.notes)root.append(card(note.at,note.text));
}
function settings(root){
append(root,head(t('settings'),'Privacy, explicit third-party access and import budgets.',[button(t('settingsOpen'),'settings',true)]));
root.append(card('Default privacy','Local-first. No automatic uploads or scans; investigations persist only with consent. Data at rest is not encrypted by Vestigivo.'));
root.append(card('RCA evidence contract','Observed signals and correlated identifiers are not a causal finding; external provider records are context only.'));
root.append(card('Budgets','8 MiB and 10,000 events per selected source by default; a case is capped at 10,000 observations.'));
root.append(el('h2','',model.language==='es'?'Conectores opcionales':'Optional integrations'));
root.append(paragraph(model.language==='es'?'Ninguna cuenta es necesaria para investigar archivos locales. Las credenciales se guardan solo en SecretStorage.':'No account is needed for local evidence. Tokens are stored only in VS Code SecretStorage.'));
const panels=el('div','grid');
for(const name of ['sentry','grafana']){
  const connected=!!(model.providers&&model.providers[name]),p=el('section','card');
  append(p,el('h3','',name==='sentry'?'Sentry issues':'Grafana Cloud annotations'),
    el('span','tag',connected?(model.language==='es'?'Conectado':'Connected'):(model.language==='es'?'Desconectado':'Disconnected')));
  const description=name==='sentry'?'Read-only issues by explicit organization/project scope (event:read).':'Read-only annotations from an official Grafana Cloud stack. Legacy alert annotations may not be returned.';
  p.append(paragraph(description));
  const commands=el('div','inline-actions');
  const connect=button(model.language==='es'?'Conectar':'Connect','providerConnect',true,{provider:name});
  const read=button(model.language==='es'?'Consultar':'Read up to 25','providerFetch',false,{provider:name});
  const disconnect=button(model.language==='es'?'Desconectar':'Disconnect','providerDisconnect',false,{provider:name});
  connect.disabled=!!model.busy||connected;read.disabled=!!model.busy||!connected;disconnect.disabled=!!model.busy||!connected;
  append(commands,connect,read,disconnect);p.append(commands);panels.append(p);

root.append(panels);
const result=model.providerResult;
if(result&&result.entries){
  root.append(el('h3','',result.provider+' — '+result.totalReturned+' records'));
  root.append(paragraph(result.note));
  for(const entry of result.entries.slice(0,25))root.append(card(entry.title||entry.id,(entry.kind||'')+' · '+(entry.service||'unknown service')+' · '+(entry.timestamp||'time unknown')+' · '+entry.id));
}
}
function renderContent(){const root=$('content');root.replaceChildren();if(!valid())return;({overview,timeline,evidence,traces,correlations,git,report,cases,settings}[tab]||overview)(root);}
function render(){if(!valid())return;document.documentElement.lang=model.language==='es'?'es':'en';for(const b of document.querySelectorAll('[data-label]'))b.textContent=t(b.dataset.label);$('subtitle').textContent=model.language==='es'?'Cada incidente deja evidencia. Observar y correlacionar no demuestra causalidad.':'Every incident leaves evidence. Observation and correlation never prove a cause by themselves.';
const s=$('status');s.replaceChildren(el('span','status-name',model.status),el('span','status-detail',model.details||'Ephemeral session; no automatic persistence.'));const stats=$('stats');stats.replaceChildren(kpi(model.case.sources.length,t('source')),kpi(model.case.observations.length,t('events')),kpi(model.case.correlations.length,t('groups')),kpi(model.case.hypotheses.filter(h=>h.state!=='CONFIRMED').length,t('unverified')));
const nav=$('navigation');nav.replaceChildren();for(const id of sections){const b=el('button','',t(id));b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===id));b.tabIndex=tab===id?0:-1;b.dataset.tab=id;nav.append(b)}renderContent()}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.tab){tab=button.dataset.tab;render();return}const action=button.dataset.action;if(!action)return;
if(action==='note'){if(noteText.trim())send('note',{text:noteText});noteText='';return}
if(action==='hypothesis'){if(claimText.trim().length>=10)send('hypothesis',{text:claimText});claimText='';return}
if(action==='openSource'){send(action,{observationId:button.dataset.observationId});return}
if(action.startsWith('provider')){send(action,{provider:button.dataset.provider});return}
send(action)});
$('navigation').addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();let i=sections.indexOf(tab);if(event.key==='ArrowRight')i=(i+1)%sections.length;if(event.key==='ArrowLeft')i=(i-1+sections.length)%sections.length;if(event.key==='Home')i=0;if(event.key==='End')i=sections.length-1;tab=sections[i];render();$('navigation').querySelectorAll('button')[i].focus()});
window.addEventListener('message',event=>{if(event.data&&event.data.type==='state'){model=event.data;render()}});
send('refresh');
})();
</script>
