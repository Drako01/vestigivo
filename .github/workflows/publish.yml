name: Vestigivo RCA / Publish
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: vestigivo-release
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate version bump and exact green PR CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-guard.cjs

  package:
    needs: authorize
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run build && npx --no-install vsce package --no-dependencies
      - name: Validate release artifact and SHA256
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').publisher")" = armotusitio
          test "$(node -p "require('./package.json').name")" = vestigivo
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test -f "vestigivo-$VERSION.vsix"
          sha256sum "vestigivo-$VERSION.vsix" | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vestigivo-release-vsix
          path: |
            vestigivo-*.vsix
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  marketplace:
    needs: [authorize, package]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: vestigivo-release-vsix
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Publish via OIDC, never use PAT
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          unset VSCE_PAT AZURE_DEVOPS_EXT_PAT
          npm exec --yes --package=@vscode/vsce@4.1.0 -- vsce publish --oidc --packagePath "vestigivo-$VERSION.vsix" --skip-duplicate

  open-vsx:
    needs: [authorize, package]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: vestigivo-release-vsix
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Publish same verified VSIX with Open VSX trusted publishing (OIDC)
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          unset OVSX_PAT OVSX_ID_TOKEN
          npm exec --yes --package=ovsx@1.3.0 -- ovsx publish "vestigivo-$VERSION.vsix" --trusted-publishing

  github-release:
    name: Publish GitHub Release with exact registry VSIX
    needs: [authorize, package, marketplace, open-vsx]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: vestigivo-release-vsix
      - name: Verify immutable bytes published to both registries
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="vestigivo-$RELEASE_VERSION.vsix"
          test -f "$asset"
          test -f SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 1
          test "$(awk '{print $2}' SHA256SUMS)" = "$asset"
          sha256sum --check SHA256SUMS
      - name: Create protected version tag and GitHub Release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          ref="refs/tags/$tag"
          asset="vestigivo-$RELEASE_VERSION.vsix"
          test "$GITHUB_REF" = "refs/heads/main"
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced during publication; refuse an outdated release"
            exit 1
          fi
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::The protected release tag already targets a different commit"
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              --raw-field ref="$ref" --raw-field sha="$GITHUB_SHA" >/dev/null
          fi
          recorded=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          test "$recorded" = "$GITHUB_SHA" || {
            echo "::error::Protected version tag SHA mismatch"
            exit 1
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Verifying existing published assets without replacement."
          else
            gh release create "$tag" "$asset" SHA256SUMS \
              --verify-tag \
              --title "Vestigivo RCA $tag" \
              --generate-notes
          fi
          mkdir -p "$RUNNER_TEMP/github-release-check"
          gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/github-release-check"
          gh release download "$tag" --pattern SHA256SUMS --dir "$RUNNER_TEMP/github-release-check"
          cmp SHA256SUMS "$RUNNER_TEMP/github-release-check/SHA256SUMS"
          cmp "$asset" "$RUNNER_TEMP/github-release-check/$asset"
          (cd "$RUNNER_TEMP/github-release-check" && sha256sum --check SHA256SUMS)
          echo "GitHub Release $tag verified: protected tag, identical VSIX and SHA256SUMS"
